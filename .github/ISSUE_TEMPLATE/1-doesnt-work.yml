name: Something doesn't work
description: An error, a button that does nothing, a wrong date or number, a crash.
title: "Doesn't work: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**This page is public.** Describe what happened without your real records. Screenshots from the sample data are best."
  - type: dropdown
    id: version
    attributes:
      label: Version
      options: ["2.1.2 beta", "Not sure"]
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      placeholder: "For example: I added a dispute to Equifax and pressed Save."
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      placeholder: Any message you saw, word for word if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: again
    attributes:
      label: Does it happen again if you do the same thing?
      options: ["Yes, every time", "Sometimes", "Only once", "Didn't try"]
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      description: Everything here is public.
      options:
        - label: I didn't include real names, account numbers, Social Security numbers, addresses, or screenshots of my own records. Any screenshots use the sample data.
          required: true
