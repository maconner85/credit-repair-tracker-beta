name: Something is confusing
description: Wording, a step, or a screen that didn't make sense.
title: "Confusing: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: "**This page is public.** Describe it without your real records."
  - type: input
    id: where
    attributes:
      label: Where in the app?
      placeholder: "For example: the letter wizard, the step about identity theft"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What was confusing?
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What would have made it clearer?
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      description: Everything here is public.
      options:
        - label: I didn't include real names, account numbers, Social Security numbers, addresses, or screenshots of my own records. Any screenshots use the sample data.
          required: true
